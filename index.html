<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROC Wing 新手配置向导 · 网页版</title>
<style>
:root{
  --bg:#070b12; --panel:#0e1626; --panel2:#111c30;
  --line:#1c2942; --line2:#24344f;
  --txt:#dbe7f5; --dim:#8ba0bd; --dim2:#5c718c;
  --cyan:#22d3ee; --cyan-d:#0e7490; --amber:#fbbf24; --green:#34d399;
  --red:#f87171; --blue:#60a5fa; --violet:#a78bfa;
  --glow-c:0 0 18px rgba(34,211,238,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;font-size:14px;
  background-image:radial-gradient(1200px 500px at 70% -10%,rgba(34,211,238,.06),transparent),
  radial-gradient(900px 500px at 10% 110%,rgba(167,139,250,.05),transparent),
  linear-gradient(rgba(28,41,66,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(28,41,66,.25) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#24344f;border-radius:4px}
.topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(11,18,32,.92);border-bottom:1px solid var(--line);position:relative;z-index:10}
.logo{width:36px;height:36px;border-radius:10px;flex:none;background:linear-gradient(135deg,#0e7490,#22d3ee);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--glow-c);font-size:20px}
.title h1{font-size:16px;letter-spacing:1px;font-weight:700}
.title h1 .sub{color:var(--cyan)}
.title p{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-top:2px}
.topbar .spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  border:1px solid var(--line2);border-radius:20px;padding:6px 14px;background:var(--panel);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#475569;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.badge-live{font-size:11px;color:var(--green);border:1px solid rgba(52,211,153,.5);border-radius:6px;
  padding:5px 10px;background:rgba(52,211,153,.06);white-space:nowrap}
.badge-demo{font-size:11px;color:var(--amber);border:1px dashed rgba(251,191,36,.5);border-radius:6px;
  padding:5px 10px;background:rgba(251,191,36,.06);white-space:nowrap}
.progress-wrap{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.progress-bar{width:140px;height:6px;border-radius:3px;background:#162032;overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--cyan-d),var(--cyan));box-shadow:var(--glow-c);transition:width .5s ease}
.layout{display:flex;height:calc(100vh - 60px)}
.rail{width:264px;flex:none;background:rgba(11,18,32,.85);border-right:1px solid var(--line);
  padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column}
.rail-head{font-size:11px;color:var(--dim2);letter-spacing:2px;padding:0 8px 10px}
.rail-foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:var(--dim2);line-height:1.8;border-top:1px solid var(--line)}
.step{display:flex;gap:12px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;position:relative;transition:all .2s}
.step:hover{background:rgba(34,211,238,.05)}
.step .num{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--dim);border:1.5px solid var(--line2);background:var(--panel)}
.step .tx b{display:block;font-size:13px;font-weight:600;color:var(--dim);line-height:1.35}
.step .tx span{font-size:11px;color:var(--dim2)}
.step.done .num{background:rgba(52,211,153,.12);border-color:var(--green);color:var(--green)}
.step.done .tx b{color:var(--txt)}
.step.active{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.35)}
.step.active .num{background:var(--cyan);border-color:var(--cyan);color:#06222b;box-shadow:var(--glow-c)}
.step.active .tx b{color:#fff}
.step.locked{opacity:.45;cursor:not-allowed}
.step:not(:last-child)::after{content:"";position:absolute;left:24px;top:44px;bottom:-8px;width:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:rgba(52,211,153,.4)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.stage{flex:1;overflow-y:auto;padding:28px 36px;position:relative}
.step-hero{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px}
.step-no{font-size:64px;font-weight:800;line-height:1;color:transparent;flex:none;-webkit-text-stroke:1.5px rgba(34,211,238,.45)}
.step-hero h2{font-size:22px;letter-spacing:1px;margin-bottom:6px}
.step-hero h2 .ref{font-size:11px;font-weight:400;color:var(--cyan);border:1px solid rgba(34,211,238,.4);
  border-radius:6px;padding:2px 8px;margin-left:10px;vertical-align:middle;letter-spacing:0}
.step-hero p{color:var(--dim);font-size:13px;line-height:1.7;max-width:780px}
.warn-strip{margin:14px 0;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.7;
  border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.07);color:#fecaca}
.warn-strip.amber{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06);color:#fde68a}
.warn-strip b{color:#fff}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h3{font-size:14px;letter-spacing:1px;margin-bottom:14px;color:var(--cyan);display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--cyan);box-shadow:var(--glow-c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
.navbar{flex:none;display:flex;align-items:center;gap:14px;padding:14px 36px;
  border-top:1px solid var(--line);background:rgba(11,18,32,.92)}
.btn{border:none;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1px;border-radius:10px;
  padding:12px 34px;transition:all .2s;font-family:inherit}
.btn-prev{background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
.btn-prev:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn-next{background:linear-gradient(135deg,#0e7490,#22d3ee);color:#04222b;box-shadow:var(--glow-c)}
.btn-next:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-sm{padding:8px 18px;font-size:12px}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.btn-ghost{background:transparent;color:var(--dim2);border:none;font-size:12px;padding:8px 10px;letter-spacing:0}
.btn-ghost:hover{color:var(--amber)}
.nav-hint{font-size:12px;color:var(--dim2)}
.navbar .spacer{flex:1}
.ch-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.ch-row .lb{width:92px;flex:none;font-size:12px;color:var(--dim)}
.ch-row .lb b{color:var(--txt)}
.ch-bar{flex:1;height:22px;background:#0a1220;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.ch-bar .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(139,160,189,.4)}
.ch-bar .fill{position:absolute;top:3px;bottom:3px;border-radius:4px;background:linear-gradient(90deg,var(--cyan-d),var(--cyan));transition:all .1s}
.ch-val{width:64px;flex:none;text-align:right;font-family:Consolas,monospace;font-size:13px;color:var(--cyan)}
.opt{border:1.5px solid var(--line2);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;
  background:rgba(10,18,32,.5);position:relative}
.opt:hover{border-color:var(--cyan)}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.07);box-shadow:var(--glow-c)}
.opt.sel::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--cyan);font-weight:800}
.opt h4{font-size:14px;margin-bottom:6px}
.opt p{font-size:12px;color:var(--dim);line-height:1.7}
.opt .tag{display:inline-block;font-size:11px;border-radius:4px;padding:2px 8px;margin-top:8px;
  background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.35)}
.opt .tag.warn{background:rgba(251,191,36,.1);color:var(--amber);border-color:rgba(251,191,36,.35)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;cursor:pointer;transition:background .15s}
.check:hover{background:rgba(34,211,238,.05)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--cyan);cursor:pointer;flex:none}
.check .t b{display:block;font-size:13px;margin-bottom:3px}
.check .t span{font-size:12px;color:var(--dim);line-height:1.6}
.check.done .t b{color:var(--green)}
.inp,select.inp{background:#0a1220;border:1px solid var(--line2);color:var(--txt);border-radius:8px;
  padding:10px 14px;font-size:14px;font-family:inherit;outline:none;width:100%}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.2)}
label.f{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:1px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px}
.kv span:first-child{color:var(--dim)}
.kv b{font-family:Consolas,monospace;color:var(--cyan);font-weight:600;text-align:right}
.kv b.ok{color:var(--green)} .kv b.bad{color:var(--red)} .kv b.warnv{color:var(--amber)}
.tile{background:#0a1220;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.tile .v{font-size:22px;font-weight:700;font-family:Consolas,monospace;color:var(--cyan)}
.tile .v.ok{color:var(--green)} .tile .v.bad{color:var(--red)} .tile .v.warnv{color:var(--amber)}
.tile .k{font-size:11px;color:var(--dim2);margin-top:6px;letter-spacing:1px}
.logbox{background:#060a11;border:1px solid var(--line);border-radius:10px;padding:12px 14px;height:150px;
  overflow-y:auto;font-family:Consolas,monospace;font-size:12px;line-height:1.8;color:var(--dim)}
.logbox .ok{color:var(--green)} .logbox .warn{color:var(--amber)} .logbox .err{color:var(--red)}
.sticks{display:flex;gap:40px;justify-content:center;padding:10px 0 4px;flex-wrap:wrap}
.stick{width:150px;height:150px;border-radius:50%;background:#0a1220;border:2px solid var(--line2);position:relative}
.stick .ch{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}
.stick .knob{position:absolute;width:34px;height:34px;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#67e8f9,#0e7490);
  box-shadow:var(--glow-c);transition:all .5s}
.stick .lbl{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:var(--amber)}
.aux-row{display:grid;grid-template-columns:64px 1fr 1.5fr;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.aux-row .lb{font-family:Consolas,monospace;font-weight:700;color:var(--cyan)}
.aux-row .cur{font-size:12px;color:var(--dim)}
.gimbals{display:flex;gap:36px;justify-content:center;padding:10px 0;flex-wrap:wrap}
.gimbal{width:170px;height:170px;border-radius:14px;background:#0a1220;border:2px solid var(--line2);position:relative;flex:none}
.gimbal .gl{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}
.gimbal .cross{position:absolute;background:var(--line)}
.gimbal .dot{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.55);transform:translate(-50%,-50%);left:50%;top:50%}
.gimbal .zone{position:absolute;width:26%;height:26%;border-radius:8px;border:2px dashed rgba(255,255,255,.12);transition:all .2s}
.gimbal .zone.arm{right:5px;bottom:5px}
.gimbal .zone.dis{left:5px;bottom:5px}
.gimbal .zone.hit-arm{border-color:var(--green);background:rgba(52,211,153,.18)}
.gimbal .zone.hit-dis{border-color:var(--amber);background:rgba(251,191,36,.18)}
.gimbal.dim{opacity:.5}
.tail-light{width:46px;height:46px;border-radius:50%;margin:6px auto;transition:all 1s;background:#3a2a10;border:2px solid #5c4a1a}
.tail-light.orange{background:radial-gradient(circle at 40% 35%,#fcd34d,#f59e0b);box-shadow:0 0 24px rgba(245,158,11,.8);border-color:#f59e0b}
.tail-light.green{background:radial-gradient(circle at 40% 35%,#6ee7b7,#10b981);box-shadow:0 0 24px rgba(52,211,153,.8);border-color:#10b981}
.mode-card{border-radius:12px;padding:18px;border:1px solid var(--line2);background:rgba(10,18,32,.55)}
.mode-card .mn{font-size:16px;font-weight:800;letter-spacing:1px;margin-bottom:4px}
.mode-card .en{font-size:11px;color:var(--dim2);letter-spacing:2px;margin-bottom:10px}
.mode-card p{font-size:12.5px;color:var(--dim);line-height:1.8}
.mode-card.q .mn{color:var(--cyan)} .mode-card.c .mn{color:var(--amber)}
.mode-card.f .mn{color:var(--blue)} .mode-card.r .mn{color:var(--violet)}
.finish{text-align:center;padding:40px 20px}
.finish .big{font-size:64px;margin-bottom:12px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.finish h2{font-size:26px;letter-spacing:2px;margin-bottom:10px;
  background:linear-gradient(90deg,#34d399,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.finish p{color:var(--dim);line-height:2;font-size:14px}
table.map{width:100%;border-collapse:collapse;font-size:13px}
table.map th,table.map td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
table.map th{color:var(--dim2);font-weight:500;font-size:11px;letter-spacing:2px}
table.map td.mp{color:var(--dim)} table.map td.wz{color:var(--cyan)}
.note{font-size:12px;color:var(--dim2);line-height:1.8;margin-top:10px}
.step-fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mode-live{text-align:center;padding:16px 10px;border:1px solid var(--line);border-radius:12px;background:#0b1526}
.ml-mode{font-size:34px;font-weight:800;letter-spacing:3px;font-family:Consolas,monospace}
.ml-mode.q{color:var(--cyan)}.ml-mode.r{color:var(--red)}.ml-mode.c{color:var(--green)}.ml-mode.f{color:var(--amber)}.ml-mode.n{color:var(--text)}
.ml-cn{font-size:15px;color:var(--dim);margin-top:6px}
.ml-sub{font-size:12px;color:var(--dim2);margin-top:8px;font-family:Consolas,monospace}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">🛩️</div>
  <div class="title">
    <h1>ROC WING <span class="sub">新手配置向导</span></h1>
    <p>网页版 · WebSerial 直连飞控 · 替代 MISSION PLANNER 配置流程 · 按官方说明书步骤编排</p>
  </div>
  <div class="spacer"></div>
  <span id="modeBadge" class="badge-demo" style="display:none">🎬 演示模式</span>
  <div class="pill"><span class="dot" id="connDot"></span><span id="connTxt">未连接飞控</span></div>
  <button class="btn btn-sm btn-ghost" id="btnDisc" style="display:none">断开</button>
  <div class="progress-wrap"><span id="progTxt">0 / 13</span><div class="progress-bar"><i id="progFill"></i></div></div>
</div>
<div class="layout">
  <div class="rail">
    <div class="rail-head">配置步骤</div>
    <div id="railSteps"></div>
    <div class="rail-foot">💡 请使用 <b style="color:var(--cyan)">Chrome / Edge</b> 打开本页面（需 WebSerial 支持）。可双击本地打开，或部署到 HTTPS / localhost。<br>飞控通过 USB 连接电脑后，在第 2 步点击连接。</div>
  </div>
  <div class="main">
    <div class="stage"><div id="stageBody" class="step-fade"></div></div>
    <div class="navbar">
      <button class="btn btn-prev" id="btnPrev">← 上一步</button>
      <span class="nav-hint" id="navHint"></span>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="btnSkip" style="display:none">跳过此步 →</button>
      <button class="btn btn-next" id="btnNext">下一步 →</button>
    </div>
  </div>
</div>
<script>
"use strict";
/* =====================================================================
   ROC Wing 新手配置向导 · 网页版
   WebSerial + 自研 MAVLink，直连飞控完成说明书全部配置步骤。
   ===================================================================== */
const $ = id => document.getElementById(id);

/* ================= MAVLink v1/v2 最小实现 ================= */
const MAV = { sysid:255, compid:190, seq:0, targetSys:1, targetComp:1 };
const CRC_EXTRA = {0:50,1:124,24:24,65:118,74:20,21:159,22:220,20:214,23:168,76:152,77:143,253:83,148:178,193:75};

function mavCrc(data, extra){
  let crc = 0xFFFF;
  const acc = b => {
    let tmp = (b ^ (crc & 0xFF)) & 0xFF;
    tmp = (tmp ^ (tmp << 4)) & 0xFF;
    crc = ((crc >>> 8) ^ (tmp << 8) ^ (tmp << 3) ^ (tmp >>> 4)) & 0xFFFF;
  };
  for (let i=0;i<data.length;i++) acc(data[i]);
  acc(extra);
  return crc;
}
function packV2(msgid, payload){
  const extra = CRC_EXTRA[msgid];
  const h = new Uint8Array(10);
  h[0]=0xFD; h[1]=payload.length; h[2]=0; h[3]=0;
  h[4]=MAV.seq & 0xFF; MAV.seq=(MAV.seq+1)&0xFF;
  h[5]=MAV.sysid; h[6]=MAV.compid;
  h[7]=msgid&0xFF; h[8]=(msgid>>8)&0xFF; h[9]=(msgid>>16)&0xFF;
  const body = new Uint8Array(9+payload.length);
  body.set(h.subarray(1),0); body.set(payload,9);
  const crc = mavCrc(body, extra);
  const out = new Uint8Array(12+payload.length);
  out.set(h,0); out.set(payload,10);
  out[10+payload.length]=crc&0xFF; out[11+payload.length]=(crc>>8)&0xFF;
  return out;
}
function encHeartbeat(){
  const p=new Uint8Array(9), dv=new DataView(p.buffer);
  dv.setUint32(0,0,true);   /* custom_mode u32 按 MAVLink 重排规则在最前 */
  dv.setUint8(4,6); dv.setUint8(5,8); dv.setUint8(6,0);
  dv.setUint8(7,0); dv.setUint8(8,3);
  return packV2(0,p);
}
function encParamRequestList(){
  return packV2(21, new Uint8Array([MAV.targetSys, MAV.targetComp]));
}
function encParamRequestRead(name, index){
  const p=new Uint8Array(20), dv=new DataView(p.buffer);
  dv.setInt16(0, index===undefined?-1:index, true);
  dv.setUint8(2,MAV.targetSys); dv.setUint8(3,MAV.targetComp);
  for(let i=0;i<16;i++) dv.setUint8(4+i, i<name.length?name.charCodeAt(i):0);
  return packV2(20,p);
}
function encParamSet(name, value, type){
  const p=new Uint8Array(23), dv=new DataView(p.buffer);
  dv.setFloat32(0, value, true);   /* MAVLink: param_value 以 float 传输且排最前 */
  dv.setUint8(4,MAV.targetSys); dv.setUint8(5,MAV.targetComp);
  for(let i=0;i<16;i++) dv.setUint8(6+i, i<name.length?name.charCodeAt(i):0);
  dv.setUint8(22, type);
  return packV2(23,p);
}
function encCommandLong(cmd, a,b,c,d,e,f,g){
  const p=new Uint8Array(33), dv=new DataView(p.buffer);
  [a,b,c,d,e,f,g].forEach((v,i)=>dv.setFloat32(i*4, v||0, true));
  dv.setUint16(28,cmd,true);
  dv.setUint8(30,MAV.targetSys); dv.setUint8(31,MAV.targetComp); dv.setUint8(32,0);
  return packV2(76,p);
}
const encSetMsgInterval = (msgid,hz) => encCommandLong(511, msgid, hz>0?1e6/hz:0, 0,0,0,0,0);

/* ---- 安全读取（兼容零截断短包） ---- */
const dvOf = p => new DataView(p.buffer, p.byteOffset, p.byteLength);
const U8 =(dv,o)=> o<dv.byteLength?dv.getUint8(o):0;
const U16=(dv,o)=> o+1<dv.byteLength?dv.getUint16(o,true):0;
const I16=(dv,o)=> o+1<dv.byteLength?dv.getInt16(o,true):0;
const U32=(dv,o)=> o+3<dv.byteLength?dv.getUint32(o,true):0;
const I32=(dv,o)=> o+3<dv.byteLength?dv.getInt32(o,true):0;
const F32=(dv,o)=> o+3<dv.byteLength?dv.getFloat32(o,true):0;
const STR=(dv,o,n)=>{ let s=''; for(let i=0;i<n&&o+i<dv.byteLength;i++){ const c=dv.getUint8(o+i); if(!c)break; s+=String.fromCharCode(c);} return s; };

/* ---- 收包解析 ---- */
const msgHandlers = {};
const onMsg = (id,fn)=>{ msgHandlers[id]=fn; };
let rxBuf = new Uint8Array(0);
function feedBytes(chunk){
  const nb=new Uint8Array(rxBuf.length+chunk.length);
  nb.set(rxBuf); nb.set(chunk,rxBuf.length); rxBuf=nb;
  let i=0;
  while(i<rxBuf.length){
    const m=rxBuf[i];
    if(m!==0xFD&&m!==0xFE){ i++; continue; }
    if(m===0xFD){
      if(i+10>rxBuf.length) break;
      const len=rxBuf[i+1];
      if(i+12+len>rxBuf.length) break;
      const msgid=rxBuf[i+7]|(rxBuf[i+8]<<8)|(rxBuf[i+9]<<16);
      const extra=CRC_EXTRA[msgid];
      const body=rxBuf.subarray(i+1,i+10+len);
      const ok = extra===undefined ? true :
        (()=>{ const c=mavCrc(body,extra);
          return (c&0xFF)===rxBuf[i+10+len] && ((c>>8)&0xFF)===rxBuf[i+11+len]; })();
      if(ok){ const h=msgHandlers[msgid]; if(h) h(rxBuf.subarray(i+10,i+10+len), rxBuf[i+5], rxBuf[i+6]); }
      i+=12+len;
    }else{
      if(i+6>rxBuf.length) break;
      const len=rxBuf[i+1];
      if(i+8+len>rxBuf.length) break;
      const msgid=rxBuf[i+5], extra=CRC_EXTRA[msgid];
      const body=rxBuf.subarray(i+1,i+6+len);
      const ok = extra===undefined ? true :
        (()=>{ const c=mavCrc(body,extra);
          return (c&0xFF)===rxBuf[i+6+len] && ((c>>8)&0xFF)===rxBuf[i+7+len]; })();
      if(ok){ const h=msgHandlers[msgid]; if(h) h(rxBuf.subarray(i+6,i+6+len), rxBuf[i+3], rxBuf[i+4]); }
      i+=8+len;
    }
  }
  rxBuf = rxBuf.slice(i);
}

    const port = await navigator.serial.requestPort();

  },
  async _readLoop(port){
    const reader = port.readable.getReader();
    this._reader=reader;
    try{
      while(true){
        const {value,done} = await reader.read();
        if(done) break;
        if(value && value.length) feedBytes(value);

    }catch(e){ /* 断开 */ }
    finally{ try{reader.releaseLock();}catch(_){} }

  _onDrop(){

  async disconnect(){

    try{ if(this.writer) this.writer.releaseLock(); }catch(_){}
    try{ if(this.port) await this.port.close(); }catch(_){}

  _waitFor(cond, ms, errMsg){

  async downloadParams(onProg){

        if(this.paramCount && this._paramIdx.size>=this.paramCount){ clearInterval(iv); res(); }
        else if(Date.now()-t0>30000){ clearInterval(iv); res(); }
      },300);
    });
  },
  async getParam(name){
    if(this.params.has(name)) return this.params.get(name).value;
    if(this.demo) throw new Error('演示模式无此参数: '+name);

  _waitParam(name, ms){
    return new Promise((res,rej)=>{
      const to=setTimeout(()=>{ this._paramWaiters=this._paramWaiters.filter(w=>w!==w0); rej(new Error('timeout')); },ms);
      const w0={name, ok:v=>{clearTimeout(to); res(v);}};

  async setParam(name, value){

    const v = type<=8 ? Math.round(value) : value;   /* 整数类型取整，线上传输仍为 float */
    if(this.demo){ this.params.set(name,{value:v,type}); this.emit('param',{name}); return true; }
    this._send(encParamSet(name, v, type));
    const echo = await this._waitParam(name, 4000).catch(()=>null);
    if(echo===null) throw new Error('写入无回执: '+name);
    const okk = type<=8 ? Math.abs(echo-v)<0.6 : Math.abs(echo-v)<Math.abs(v)*1e-4+1e-6;
    if(!okk) throw new Error('写入回执不符: '+name);
    return true;
  },

  },

onMsg(0,(p,sys,comp)=>{           /* HEARTBEAT：custom_mode u32 在最前 */

onMsg(22,(p)=>{                   /* PARAM_VALUE：value, count, index, id[16], type */
  const dv=dvOf(p);
  const val=F32(dv,0), count=U16(dv,4), idx=U16(dv,6);
  const name=STR(dv,8,16), type=U8(dv,24);
  FC.params.set(name,{value:val,type});
  FC.paramCount=count; FC._paramIdx.add(idx);
  (FC._paramWaiters||[]).filter(w=>w.name===name).forEach(w=>w.ok(val));
  FC._paramWaiters=(FC._paramWaiters||[]).filter(w=>w.name!==name);
  FC.emit('param',{name});
});
onMsg(65,(p)=>{                   /* RC_CHANNELS：time u32, chan1-18 u16, chancount, rssi */
  const dv=dvOf(p);

/* ================= 渲染与导航 ================= */
function renderRail(){
  $('railSteps').innerHTML = STEPS.map((s,i)=>{
    const cls = S.done.has(i)?'done':(i===S.step?'active':(i<=maxReached?'':'locked'));
    const mark = S.done.has(i)?'✓':String(i+1).padStart(2,'0');
    return `<div class="step ${cls}" data-i="${i}"><div class="num">${mark}</div><div class="tx"><b>${s.t}</b><span>${s.s}</span></div></div>`;
  }).join('');
  document.querySelectorAll('#railSteps .step').forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.i; if(i<=maxReached){ S.step=i; render(); } };
  });
}
function refreshTop(){
  $('progTxt').textContent = S.done.size+' / '+TOTAL;
  $('progFill').style.width = (S.done.size/TOTAL*100)+'%';
  const c = FC.connected;
  $('connDot').classList.toggle('on', c);
  $('connTxt').textContent = c ? ('已连接'+(FC.demo?' · 演示':'')) : '未连接飞控';
  $('btnDisc').style.display = c?'':'none';
  $('modeBadge').style.display = (c&&FC.demo)?'':'none';
}
function render(){
  cleaners.forEach(f=>f()); cleaners=[];
  const i=S.step;
  maxReached=Math.max(maxReached,i);
  const body=$('stageBody');
  body.classList.remove('step-fade'); void body.offsetWidth; body.classList.add('step-fade');
  body.innerHTML=R[i]();
  try{ bindStep(i); }catch(e){ body.innerHTML+=`<div class="warn-strip">⚠️ 本步加载异常：${e.message}</div>`; }
  renderRail(); refreshTop();
  $('btnPrev').disabled = i===0;
  $('btnNext').disabled = !canNext[i]();
  $('btnNext').innerHTML = i===TOTAL-1 ? '完成 🎉' : '下一步 →';
  $('navHint').textContent = canNext[i]()?'':HINTS[i];
  $('btnSkip').style.display = SKIPPABLE.has(i)&&!S.done.has(i) ? '' : 'none';
  body.parentElement.scrollTop=0;
}
function markDone(i){ S.done.add(i); render(); }
$('btnPrev').onclick=()=>{ if(S.step>0){ S.step--; render(); } };
$('btnNext').onclick=()=>{ if(!canNext[S.step]())return; markDone(S.step); if(S.step<TOTAL-1){ S.step++; render(); } };
$('btnSkip').onclick=()=>{ markDone(S.step); if(S.step<TOTAL-1){ S.step++; render(); } };
$('btnDisc').onclick=async()=>{ await FC.disconnect(); refreshTop(); render(); };
onFcGlobal();
function onFcGlobal(){
  FC.on('disconnect',()=>{ refreshTop(); $('navHint').textContent='⚠️ 飞控已断开，请返回第 2 步重新连接'; });
  FC.on('heartbeat',()=>{ if(S.step===1||S.step===8||S.step===12) refreshTop(); });
}
/* ================= 各步事件绑定 ================= */
function bindStep(i){
  if(i===1){
    if(!FC.connected){
      const prog=$('connProg');
      const cnt=()=>{ prog.innerHTML=`<span style="color:var(--cyan)"><span class="spin">⏳</span> 正在下载参数… ${FC._paramIdx.size} / ${FC.paramCount||'…'}</span>`; };
      onFc('param',cnt);
      $('btnConn').onclick=async()=>{
        $('btnConn').disabled=true; $('btnDemo').disabled=true;
        prog.innerHTML='<span style="color:var(--dim)"><span class="spin">⏳</span> 等待选择串口…</span>';
        try{ await FC.connect(); refreshTop(); render(); }
        catch(e){
          prog.innerHTML=`<div class="warn-strip">⚠️ 连接失败：${String(e.message||e).replace(/</g,'&lt;')}<br><span style="color:var(--dim)">常见原因：浏览器未授权串口 / 飞控未上电 / USB 线仅充电无数据 / 串口被 Mission Planner 占用。</span></div>`;
          $('btnConn').disabled=false; $('btnDemo').disabled=false;
        }
      };
      $('btnDemo').onclick=async()=>{
        $('btnConn').disabled=true; $('btnDemo').disabled=true;
        prog.innerHTML='<span style="color:var(--dim)">正在加载演示数据…</span>';
        await FC.connectDemo(); refreshTop(); render();
      };
    }else{
      const log=$('msgLog');
      const paint=()=>{ log.innerHTML=FC.msgs.map(m=>`<div class="${m.sev<=3?'err':m.sev===4?'warn':'ok'}">[${new Date(m.t).toLocaleTimeString()}] ${String(m.text).replace(/</g,'&lt;')}</div>`).join(''); log.scrollTop=log.scrollHeight; };
      paint(); onFc('msg',paint);
      $('btnReboot').onclick=()=>{ if(confirm('确定重启飞控吗？部分参数（如串口/OSD）需重启生效。')) FC.reboot(); };
      $('btnPageDisc').onclick=async()=>{ await FC.disconnect(); refreshTop(); render(); };
    }
  }

  if(i===2){
    let track=null;
    const paint=()=>{
      for(let k=1;k<=16;k++){
        const f=$('chf'+k); if(!f) return;
        const v=FC.rc[k-1]||1500, pct=(v-1000)/1000*100;
        f.style.left=Math.min(50,pct)+'%'; f.style.width=Math.abs(pct-50)+'%';
        $('chv'+k).textContent=v;
      }
      if(track){
        for(let k=0;k<16;k++){ const v=FC.rc[k]; if(v>900&&v<2100){ track.min[k]=Math.min(track.min[k],v); track.max[k]=Math.max(track.max[k],v); } }
        $('calTrack').innerHTML=track.min.map((mn,k)=>`<div class="tile"><div class="v" style="font-size:13px">${mn>track.max[k]?'–':mn+'/'+track.max[k]}</div><div class="k">CH${k+1}</div></div>`).join('');

    };
    $('btnCalDone').onclick=async()=>{
      if(!track) return;
      $('btnCalDone').disabled=true;
      $('calMsg').innerHTML='<span style="color:var(--amber)">💾 写入中…（摇杆已回中、油门最低）</span>';
      try{
        for(let n=1;n<=16;n++){
          if(track.min[n-1]>track.max[n-1]) continue;   /* 该通道没动过则跳过 */
          $('calMsg').textContent=`💾 正在写入 CH${n}…`;
          await FC.setParam('RC'+n+'_MIN',track.min[n-1]);

    $('btnGestDemo').onclick=()=>{
      let t=0; demoRun=true;
      gestMsg.innerHTML='<span style="color:var(--cyan)">▶ 演示：左摇杆 → 右下角保持…</span>';
      const iv=setInterval(()=>{
        t+=60;
        if(t<800){ const k=t/800; setDot(dotL,1500+500*k,1500-500*k,false); }
        else if(t<2600){ setDot(dotL,2000,1000,false); }
        else { clearInterval(iv); demoRun=false; setDot(dotL,1500,1500,false);
          if(!S.armOk) gestMsg.innerHTML='把左摇杆推到<b style="color:var(--green)">右下角</b>保持 2 秒，或点击演示观看'; }
      },60);
    };
    $('btnArmOk').onclick=()=>{ armDone('（手动确认）'); };
    /* ---- 模式与辅助通道默认确认 ---- */
    const y3warn=(n,qEn)=>{
      if(n===16) return ['err','INITIALISING 不可设为常用模式'];
      if(n===14) return ['err','AVOID_ADSB 由防撞系统自动进入，不可手动设置'];
      if(isQm(n)&&!qEn) return ['err','Q 系列模式需要 Q_ENABLE=1，否则无法进入'];
      if(n===13) return ['warn','固定翼自动起飞（需跑道）；VTOL 建议用 QLOITER 垂直起飞'];
      if(n===8) return ['warn','AUTOTUNE 是固定翼自整定；VTOL 用 QAUTOTUNE'];
      return null;
    };
    const qEn=pvi('Q_ENABLE')===1;
    let mrows='', hasQ=false, errN=0; const seen={};
    for(let s2=1;s2<=6;s2++){
      const v=pvi('FLTMODE'+s2), w=v===undefined?null:y3warn(v,qEn);
      if(v!==undefined){ if(isQm(v))hasQ=true; seen[v]=(seen[v]||0)+1; if(w&&w[0]==='err')errN++; }
      mrows+='<tr><td>'+s2+'</td><td class="mp">FLTMODE'+s2+'</td><td class="wz">'+(v===undefined?'–':modeName(v)+(MODE_CN[v]?'（'+MODE_CN[v]+'）':''))+'</td><td>'+(w?'<span class="'+w[0]+'">'+w[1]+'</span>':'<span class="ok">✓</span>')+'</td></tr>';
    }
    $('modeConfTbl').innerHTML='<table class="map"><tr><th>档位</th><th>参数</th><th>模式</th><th>Y3 检查</th></tr>'+mrows+'</table>';
    let arows='';
    for(let ch=5;ch<=16;ch++){ if(ch===fmCh) continue;
      const v=pvi('RC'+ch+'_OPTION');
      arows+='<tr'+(v?'':' style="opacity:.45"')+'><td>CH'+ch+'</td><td class="mp">RC'+ch+'_OPTION</td><td class="wz">'+(v===undefined?'–':auxName(v))+'</td></tr>';
    }
    $('auxConfTbl').innerHTML='<table class="map"><tr><th>通道</th><th>参数</th><th>功能</th></tr>'+arows+'</table>';
    const dups=Object.keys(seen).filter(k=>seen[k]>1);
    $('modeWarn').innerHTML=(errN?'<div class="warn-strip">⚠️ 发现 <b style="color:var(--red)">'+errN+' 项错误</b>配置，请回第 6 步修改后再继续。</div>':'')
      +(!hasQ&&qEn?'<p class="note">建议至少配置一个 QLOITER，用于垂直起降。</p>':'')
      +(dups.length?'<p class="note">存在重复配置的模式档位。</p>':'');
    $('btnModeOk').onclick=()=>{ S.modeOk=true; $('btnModeOk').disabled=true;
      $('btnModeOk').textContent='✓ 已确认记住'; gate(); };
    gate();
  }

  if(i===7){
    $('btnModeRead').onclick=()=>{ S.modeRead=true; $('btnModeRead').disabled=true; $('btnModeRead').textContent='✓ 已学习';
      $('btnNext').disabled=false; $('navHint').textContent=''; };
  }

  if(i===9){
    $('mspCur').textContent=pvi('MSP_OPTIONS')??'–';
    let sel='dji';
    document.querySelectorAll('#vtxOpts .opt').forEach(o=>{
      o.onclick=()=>{
        document.querySelectorAll('#vtxOpts .opt').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel'); sel=o.dataset.vtx; S.vtxDone=false; $('vtxMsg').textContent='';
        $('btnNext').disabled=true; $('navHint').textContent=HINTS[9];
      };
    });
    document.querySelector('#vtxOpts .opt').click();
    $('btnVtx').onclick=async()=>{
      $('btnVtx').disabled=true; $('vtxMsg').textContent='写入中…';
      try{
        if(sel==='dji') await FC.setParam('MSP_OPTIONS',+$('mspSel').value);
        else if(sel==='ws') await FC.setParam('MSP_OPTIONS',0);
        S.vtxDone=true;
        $('vtxMsg').innerHTML='<span style="color:var(--green)">✓ 已写入飞控</span>';
        $('btnNext').disabled=false; $('navHint').textContent='';
      }catch(e){ $('vtxMsg').innerHTML=`<span style="color:var(--red)">⚠️ ${String(e.message).replace(/</g,'&lt;')}</span>`; }
      $('btnVtx').disabled=false;
    };
  }

  if(i===10){
    const upd=()=>{
      const t=$('tVolt'); if(!t) return;
      t.textContent=FC.voltage.toFixed(1);
      const g=$('tGps'); g.textContent=FC.sats+'颗'; g.className='v '+(FC.gpsFix>=3?'ok':'warnv');
      $('tMode').textContent=modeName(FC.modeNum); $('tMode').style.fontSize='14px';
      const a=$('tArm'); a.textContent=FC.armed?'已解锁':'已上锁'; a.className='v '+(FC.armed?'bad':'ok');
    };
    onFc('telemetry',upd); onFc('heartbeat',upd); every(1000,upd); upd();
    const all=[...document.querySelectorAll('#finalList input')];
    const box=$('finishBox');
    const refresh=()=>{
      const n=all.filter(x=>x.checked).length;
      all.forEach(cb=>cb.closest('.check').classList.toggle('done',cb.checked));
      if(n===all.length&&!box.innerHTML){
        const fm=[1,2,3,4,5,6].map(k=>modeName(pvi('FLTMODE'+k))).join(' / ');
        box.innerHTML=`<div class="card finish"><div class="big">🎉</div><h2>配置完成，可以飞行！</h2>
        <p>六档模式：${fm}　·　电池 ${Math.round(pv('BATT_CAPACITY')||0)}mAh　·　MSP_OPTIONS=${pvi('MSP_OPTIONS')??'–'}<br>
        首飞建议：空旷场地 · 微风 · QLOITER 起飞 · 先悬停熟悉杆量</p>
        <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-prev btn-sm" id="btnFinReboot">🔄 重启飞控</button>
        <button class="btn btn-next btn-sm" id="btnExport">📄 导出配置摘要</button></div>
        <p class="note">部分参数需重启飞控生效，建议重启后再验证一次。</p></div>`;
        $('btnFinReboot').onclick=()=>{ if(confirm('确定重启飞控吗？')) FC.reboot(); };
        $('btnExport').onclick=()=>{
          const L=['ROC Wing 配置摘要 '+new Date().toLocaleString(),''];
          ['FLTMODE_CH','FLTMODE1','FLTMODE2','FLTMODE3','FLTMODE4','FLTMODE5','FLTMODE6','BATT_CAPACITY','ARSPD_TYPE','ARSPD_RATIO','MSP_OPTIONS','Q_TILT_TYPE']
            .forEach(k=>{ const p=FC.params.get(k); L.push(k+' = '+(p?p.value:'?')); });
          const a=document.createElement('a');
          a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/plain'}));
          a.download='roc-wing-config.txt'; a.click();
        };
      }else if(n<all.length) box.innerHTML='';
    };
    all.forEach(cb=>cb.onchange=refresh);
  }
}

/* ================= 启动 ================= */
render();
</script>
</body>
</html>
